version: "3.8"

services:
  postgres:
    mem_limit: 1g
    cpus: "1"

  redis:
    mem_limit: 512m
    cpus: "0.5"

  api:
    mem_limit: 2g
    cpus: "2"
    environment:
      SOP_GENERATOR: ${SOP_GENERATOR:-llm}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}

  worker:
    mem_limit: 2g
    cpus: "2"
    environment:
      SOP_GENERATOR: ${SOP_GENERATOR:-llm}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}

  frontend:
    mem_limit: 1g
    cpus: "1"
    environment:
      NODE_ENV: production