services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worktrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-worktrace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Publish to host so local `pnpm dev` can use localhost (see apps/api/.env.example).
    # Also join `local` because `backend` is internal and cannot publish host ports alone.
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    networks:
      - backend
      - local
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-worktrace} -d ${POSTGRES_DB:-worktrace}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    # Publish to host for local API/worker tooling outside Compose.
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - backend
      - local
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./apps/api
    command: alembic upgrade head
    environment: &api-environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-worktrace}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-worktrace}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-replace-this-development-secret}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-22222222-2222-2222-2222-222222222222}
      DEMO_ROLE_PASSWORD: ${DEMO_ROLE_PASSWORD:-}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost}
      SOP_GENERATOR: ${SOP_GENERATOR:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      PRELOAD_WHISPER_MODEL: ${PRELOAD_WHISPER_MODEL:-false}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-worktrace-screenshots}
      S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: 'no'

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    init: true
    environment: *api-environment
    ports:
      - '${API_PORT:-8000}:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend
      - edge
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    command: celery -A app.task_queue.celery_app worker --loglevel=info
    restart: unless-stopped
    init: true
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'celery -A app.task_queue.celery_app inspect ping --timeout 3']
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_EXTENSION_ID: ${NEXT_PUBLIC_EXTENSION_ID:-}
    restart: unless-stopped
    init: true
    environment:
      API_BASE_URL: http://api:8000
      AUTH_DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-22222222-2222-2222-2222-222222222222}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-WorkTrace}
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    # Keep service-to-service traffic isolated from the public edge network.
    internal: true
  edge:
  # Non-internal network so Postgres/Redis can publish ports to the host for
  # hybrid local development (`pnpm dev` + Compose dependencies).
  local:
