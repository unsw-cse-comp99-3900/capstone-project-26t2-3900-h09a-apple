appId: ai.unblox.worktrace.desktop
productName: WorkTrace Desktop

directories:
  output: dist

files:
  - out/**/*

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: '${productName}-${version}-windows-${arch}.${ext}'

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: '${productName}-${version}-macos-${arch}.${ext}'
