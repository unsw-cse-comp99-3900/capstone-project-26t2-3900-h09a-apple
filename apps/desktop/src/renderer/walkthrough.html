<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; script-src 'self';"
    />
    <title>WorkTrace Walkthrough</title>
    <link rel="stylesheet" href="./walkthrough.css" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <div id="highlight" class="highlight" hidden></div>
    <div id="tooltip" class="tooltip" role="dialog" aria-live="polite" hidden>
      <p id="eyebrow" class="eyebrow"></p>
      <p id="instruction" class="instruction"></p>
      <img id="preview" class="preview" alt="Step screenshot preview" hidden />
      <p id="fallbackNote" class="fallback-note" hidden></p>
      <div id="exportPanel" class="export-panel" hidden>
        <p class="export-label">Your agent prompt is ready</p>
        <div class="actions">
          <button type="button" class="btn-secondary" data-action="copy-export">Copy</button>
          <button type="button" class="btn-primary" data-action="save-export">Save file</button>
          <button type="button" class="btn-secondary" data-action="dismiss">Close</button>
        </div>
      </div>
      <div id="actions" class="actions">
        <button type="button" class="btn-secondary" data-action="previous">Previous</button>
        <button type="button" class="btn-primary" data-action="next">Next</button>
        <button type="button" class="btn-primary" data-action="finish" hidden>Finish</button>
      </div>
      <p id="error" class="error" hidden></p>
    </div>
    <script type="module" src="./walkthrough.ts"></script>
  </body>
</html>
