name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a production migration or ECS rollout with a newer main push.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm --filter @h09a/web lint

      - name: Typecheck
        run: pnpm exec turbo run typecheck

      - name: Test
        run: pnpm --filter @h09a/web test

      - name: Build
        run: pnpm --filter @h09a/web build

  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: worktrace
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: worktrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://worktrace:secret@localhost:5432/worktrace
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEFAULT_TENANT_ID: 22222222-2222-2222-2222-222222222222
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Migrate database (up-down-up)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Test
        run: pytest --cov=app --cov-report=term

  extension:
    name: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm --filter @h09a/extension lint

      - name: Typecheck
        run: pnpm --filter @h09a/extension typecheck

      - name: Test
        run: pnpm --filter @h09a/extension test

      - name: Build
        run: pnpm --filter @h09a/extension build

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # node-gyp / native rebuilds for better-sqlite3 and related addons
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # uiohook-napi and active-win need X11 headers on Linux runners
      - name: Install Linux native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxtst-dev \
            libxinerama-dev \
            libxt-dev \
            libxi-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm --filter @h09a/desktop lint

      - name: Typecheck
        run: pnpm --filter @h09a/desktop typecheck

      - name: Test desktop-storage
        run: pnpm --filter @h09a/desktop-storage test

      - name: Build
        run: pnpm --filter @h09a/desktop build
  deploy-web:
    name: deploy-web
    needs: [web, api, extension, desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@58.9.0

      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-api:
    name: deploy-api
    needs: [web, api, extension, desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-southeast-2
      ECR_REPOSITORY: worktrace-api
      ECS_CLUSTER: worktrace-cluster
      ECS_SERVICE: worktrace-api-service-0w7rw3fb
      ECS_CONTAINER: worktrace-api
      ECS_LOG_GROUP: /ecs/worktrace-api
      API_HEALTH_URL: http://worktrace-api-alb-1142763432.ap-southeast-2.elb.amazonaws.com/api/v1/health

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build -f apps/api/Dockerfile -t "$image_uri" apps/api
          docker push "$image_uri"
          echo "uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Register task definition
        id: task-definition
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          current_task_definition="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].taskDefinition' \
              --output text
          )"

          aws ecs describe-task-definition \
            --task-definition "$current_task_definition" \
            --query 'taskDefinition' \
            --output json > task-definition.json

          jq \
            --arg image "$IMAGE_URI" \
            --arg container "$ECS_CONTAINER" \
            '(.containerDefinitions[] | select(.name == $container) | .image) = $image
             | del(
                 .taskDefinitionArn,
                 .revision,
                 .status,
                 .requiresAttributes,
                 .compatibilities,
                 .registeredAt,
                 .registeredBy
               )' \
            task-definition.json > task-definition-next.json

          task_definition_arn="$(
            aws ecs register-task-definition \
              --cli-input-json file://task-definition-next.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"
          echo "arn=$task_definition_arn" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        env:
          TASK_DEFINITION_ARN: ${{ steps.task-definition.outputs.arn }}
        run: |
          set -euo pipefail
          network_configuration="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].networkConfiguration' \
              --output json
          )"
          overrides="$(
            jq -cn \
              --arg container "$ECS_CONTAINER" \
              '{containerOverrides: [{name: $container, command: ["alembic", "upgrade", "head"]}]}'
          )"
          run_result="$(
            aws ecs run-task \
              --cluster "$ECS_CLUSTER" \
              --launch-type FARGATE \
              --task-definition "$TASK_DEFINITION_ARN" \
              --network-configuration "$network_configuration" \
              --overrides "$overrides" \
              --output json
          )"

          if [ "$(jq '.failures | length' <<< "$run_result")" -ne 0 ]; then
            jq '.failures' <<< "$run_result"
            exit 1
          fi

          migration_task="$(jq -r '.tasks[0].taskArn' <<< "$run_result")"
          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "$migration_task"

          exit_code="$(
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$migration_task" \
              --query "tasks[0].containers[?name=='$ECS_CONTAINER'].exitCode | [0]" \
              --output text
          )"

          if [ "$exit_code" != "0" ]; then
            task_id="${migration_task##*/}"
            echo "Database migration failed with exit code $exit_code"
            aws logs get-log-events \
              --log-group-name "$ECS_LOG_GROUP" \
              --log-stream-name "ecs/$ECS_CONTAINER/$task_id" \
              --query 'events[].message' \
              --output text || true
            exit 1
          fi

      - name: Deploy API service
        env:
          TASK_DEFINITION_ARN: ${{ steps.task-definition.outputs.arn }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --force-new-deployment \
            --no-cli-pager > /dev/null

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          rollout_state="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].deployments[0].rolloutState' \
              --output text
          )"
          test "$rollout_state" = "COMPLETED"

      - name: Verify API health
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 "$API_HEALTH_URL"
