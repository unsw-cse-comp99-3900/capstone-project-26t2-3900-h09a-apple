name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Require Jira key in title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;

            if (!/H09AAPPLE-\d+/i.test(title)) {
              core.setFailed(
                'PR title must include a Jira key (e.g. H09AAPPLE-60). ' +
                  'Examples: "ci: tighten gates H09AAPPLE-60" or "[H09AAPPLE-60] ci: tighten gates".',
              );
            }

      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            build
            ci
            perf
          headerPattern: '^(?:\[H09AAPPLE-\d+\]\s*)?(\w*)(?:\(([\w$.\-*/ ]*)\))?: (.*)$'
          headerPatternCorrespondence: type, scope, subject
